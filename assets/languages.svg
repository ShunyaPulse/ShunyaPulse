    <text x="180" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#7982a9">MediaPipe • OpenCV</text>
    <text x="370" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#3572A5" text-anchor="end">45%</text>
  </g>

  <!-- Language 2: TypeScript -->
  <g transform="translate(25, 118)">
    <circle cx="6" cy="6" r="6" fill="#3178C6"/>
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c0caf5">TypeScript</text>
    <text x="180" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#7982a9">Next.js 14 • React</text>
    <text x="370" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#3178C6" text-anchor="end">35%</text>
  </g>

  <!-- Language 3: JavaScript -->
  <g transform="translate(25, 148)">
    <circle cx="6" cy="6" r="6" fill="#F1E05A"/>
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c0caf5">JavaScript</text>
    <text x="180" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#7982a9">ES6+ • HTML5 Canvas</text>
