<svg width="420" height="200" viewBox="0 0 420 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="420" height="200" rx="12" fill="#1a1b26" stroke="#24283b" stroke-width="2"/>
  
  <!-- Header -->
  <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#7aa2f7">
    💻 Primary Technologies
